name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded pull-request run proves nothing, so cancel it when a new commit arrives.
# Pushes to main are never cancelled: each commit on the default branch should keep its own
# verdict, so that a green check always refers to the commit it is attached to.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # aikit makes platform-specific claims — that Windows needs no Git Bash, that `cmd` and
    # PowerShell are driven natively, that path containment holds against Windows' verbatim
    # `\\?\` paths — and carries platform-specific code to back them. Testing only on Linux
    # would leave every one of those claims unverified by CI, which is where they regress
    # silently. Each of those behaviours has already broken at least once in a way Linux
    # could not have caught.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The whole matrix finishes in about five minutes; anything approaching this limit is
    # hung rather than slow, and a hung job otherwise burns the full six-hour default.
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit SHA, not by tag or branch. A tag can be moved and
      # `dtolnay/rust-toolchain@stable` is a *branch*, so both would otherwise let third-party
      # code change under a workflow that is meant to be reproducible. Dependabot raises a
      # pull request when a newer release exists — see .github/dependabot.yml — so pinning
      # does not mean going stale.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          # Stated explicitly because the action otherwise infers the toolchain from the ref
          # name, and a SHA names no toolchain.
          toolchain: stable
          components: rustfmt, clippy

      # Formatting and lints are platform-independent, so run them once rather than three
      # times: a failure would be identical on every runner.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --all-targets -- -D warnings

      # Tests run everywhere. Tests whose subject is a specific interpreter are gated
      # (`#[cfg(unix)]`, or a runtime probe), so a host without a POSIX shell skips those
      # rather than failing — see the portable fixtures in tests/cli_script.rs.
      #
      # `--locked` is what makes CI verify the same condition the install instructions rely
      # on. Without it, a Cargo.toml change committed without its Cargo.lock update is
      # silently repaired in the runner's workspace and CI passes — while `cargo install
      # --locked`, which the README tells users to run, fails on the lockfile that was
      # actually committed.
      - name: Test
        run: cargo test --locked

      - name: Package list
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --locked --list
