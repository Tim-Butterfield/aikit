[package]
name = "aikit"
version = "0.1.0"
edition = "2021"
description = "A local CLI for deterministic AI-assisted repository workflows."
license = "MIT"
repository = "https://github.com/Tim-Butterfield/aikit"
readme = "README.md"
keywords = ["ai", "cli", "workflow", "review", "automation"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "aikit"
path = "src/main.rs"

[dependencies]
# `wrap_help` makes clap wrap long help paragraphs to the terminal width. Without it the
# long_about text is emitted as single unwrapped lines (some over 1000 characters) and the
# terminal soft-wraps them raggedly.
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
sha2 = "0.10"
ignore = "0.4"
globset = "0.4"
regex = "1"

# MCP server (`aikit mcp`). Schemas are hand-written rather than derived, so the
# declared input/output contracts are exactly what the plan specifies.
rmcp = { version = "3", features = ["server", "transport-io"] }
# Same `CancellationToken` rmcp puts in `RequestContext`, so the request's own token reaches
# the executor directly — no bridging task, and no bespoke signal to get subtly wrong.
tokio-util = "0.7"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "process",
    "time",
    "sync",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Age-filter fixtures need to backdate a *directory's* mtime. `touch` does not exist on
# Windows, and doing it there by hand requires opening the directory with
# FILE_FLAG_BACKUP_SEMANTICS. Test-only; nothing here ships in the binary.
filetime = "0.2"
